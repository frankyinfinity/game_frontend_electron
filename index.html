<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gioco</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #fff;
            color: white;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
        }

        #display_container {
            width: 100vw;
            height: 100vh;
            background: #fff;
        }

        canvas {
            display: block;
        }

        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            padding: 1rem;
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
            z-index: 1000;
        }

        .player-info {
            font-size: 1.2rem;
            font-weight: 600;
        }

        #status-msg {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 0.7rem;
            opacity: 0.5;
            z-index: 1001;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div id="display_container"></div>
    <div id="status-msg">Inizializzazione...</div>

    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.2/pixi.min.js"></script>
    <script>window.$ = window.jQuery = require('jquery');</script>
    <script>

        const { ipcRenderer } = require('electron');
        const fs = require('fs');
        const path = require('path');
        const config = require('./config.js');
        const urlParams = new URLSearchParams(window.location.search);

        let playerId = '1';
        let sessionId = 'init_session_id';

        window.setPlayerId = function (id) {
            playerId = id;
            ipcRenderer.send('update-player-id', id);
        }

        // Initialize main process with default playerId
        ipcRenderer.send('update-player-id', playerId);

        const status = (msg) => {
            console.log('Status:', msg);
            document.getElementById('status-msg').innerText = msg;
        };

        const BACK_URL = config.BACKEND_URL;
        window.BACK_URL = BACK_URL;
        const hostname = new URL(BACK_URL).hostname;

        window.AppData = { actual_focus_uid_entity: null, scroll_groups: {} };
        window.gameWebSockets = {};
        let modalViewportMasks = {};
        const scrollRuntimeState = { scrollViewportMask: null };
        const SCROLL_CLIP_START_Y = 80;

        (function loadBackendScrollFunctions() {
            try {
                const runtimePath = path.join(__dirname, '..', 'backend', 'resources', 'js', 'function', 'scroll', 'runtime.js');
                const runtimeScript = fs.readFileSync(runtimePath, 'utf8');
                eval(runtimeScript);
            } catch (error) {
                console.error('Unable to load backend scroll functions:', error);
            }
        })();

        function runScrollClipping() {
            if (typeof window.refreshScrollClipping !== 'function') return;
            const excludedUids = typeof window.getScrollExcludedUids === 'function'
                ? window.getScrollExcludedUids(AppData)
                : [];
            window.refreshScrollClipping(app, scrollRuntimeState, objects, shapes, AppData, excludedUids, SCROLL_CLIP_START_Y);
        }

        function setObjectShapePosition(uid, x, y) {
            const obj = objects[uid];
            const shape = shapes[uid];
            if (!obj || !shape) return;

            const oldX = typeof obj.x === 'number' ? obj.x : x;
            const oldY = typeof obj.y === 'number' ? obj.y : y;
            const dx = x - oldX;
            const dy = y - oldY;

            obj.x = x;
            obj.y = y;
            shape.x = x;
            shape.y = y;

            const childUids = Array.isArray(obj.children) ? obj.children : [];
            childUids.forEach((childUid) => {
                const childObj = objects[childUid];
                const childShape = shapes[childUid];
                if (!childObj || !childShape) return;

                if (typeof childObj.x === 'number') {
                    childObj.x += dx;
                    childShape.x += dx;
                }
                if (typeof childObj.y === 'number') {
                    childObj.y += dy;
                    childShape.y += dy;
                }
                if (Array.isArray(childObj.points) && typeof childShape.clear === 'function') {
                    const color = childObj.color || 0xFFFFFF;
                    const thickness = childObj.thickness || 1;
                    childObj.points = childObj.points.map((point) => ({
                        x: point.x + dx,
                        y: point.y + dy
                    }));
                    childShape.clear();
                    childShape.lineStyle(thickness, color);
                    if (childObj.points.length > 0) {
                        childShape.moveTo(childObj.points[0].x, childObj.points[0].y);
                        for (let i = 1; i < childObj.points.length; i++) {
                            childShape.lineTo(childObj.points[i].x, childObj.points[i].y);
                        }
                    }
                }
            });
        }

        function ensureMapNavButtonsPositionAndZIndex() {
            if (!app || !app.renderer) return;

            const margin = 12;
            const gap = 6;
            const buttonSize = 34;
            const appbarHeight = 80;
            const topBaseY = appbarHeight + margin + buttonSize + gap;
            const positions = {
                map_nav_container: { x: margin - 8, y: topBaseY - buttonSize - gap - 8 },
                map_nav_up: { x: margin + buttonSize + gap, y: topBaseY - buttonSize - gap },
                map_nav_left: { x: margin, y: topBaseY },
                map_nav_down: { x: margin + buttonSize + gap, y: topBaseY },
                map_nav_right: { x: margin + ((buttonSize + gap) * 2), y: topBaseY }
            };
            const excludedUids = typeof window.getScrollExcludedUids === 'function'
                ? window.getScrollExcludedUids(AppData)
                : [];
            const navUids = excludedUids.filter((uid) => typeof uid === 'string' && uid.indexOf('map_nav_') === 0);

            navUids.forEach((uid) => {
                if (!objects[uid] || !shapes[uid]) return;
                const target = positions[uid];
                if (!target) return;

                setObjectShapePosition(uid, target.x, target.y);

                if (!objects[uid].attributes) objects[uid].attributes = {};
                const targetZ = uid === 'map_nav_container' ? 14999 : 15000;
                objects[uid].attributes.z_index = targetZ;
                shapes[uid].zIndex = targetZ;

                const childUids = Array.isArray(objects[uid].children) ? objects[uid].children : [];
                childUids.forEach((childUid) => {
                    if (!objects[childUid] || !shapes[childUid]) return;
                    if (!objects[childUid].attributes) objects[childUid].attributes = {};
                    objects[childUid].attributes.z_index = 15000;
                    shapes[childUid].zIndex = 15000;
                });
            });

            app.stage.sortChildren();
        }

        function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

        function ensureModalViewportMask(viewportUid) {
            const viewportObject = objects[viewportUid];
            const viewportShape = shapes[viewportUid];
            if (!viewportObject || !viewportShape || !viewportObject.attributes) return;

            const attrs = viewportObject.attributes;
            const childUids = Array.isArray(attrs.scroll_child_uids) ? attrs.scroll_child_uids : [];
            if (childUids.length === 0) return;

            const width = viewportObject.width || 0;
            const height = viewportObject.height || 0;
            const x = viewportObject.x || 0;
            const y = viewportObject.y || 0;
            if (width <= 0 || height <= 0) return;

            let mask = modalViewportMasks[viewportUid];
            if (!mask) {
                mask = new PIXI.Graphics();
                mask.renderable = true;
                mask.alpha = 0;
                modalViewportMasks[viewportUid] = mask;
                const parentLayer = viewportShape.parent || app.stage;
                parentLayer.addChild(mask);
            }

            mask.clear();
            mask.beginFill(0xFFFFFF);
            mask.drawRect(0, 0, width, height);
            mask.endFill();
            mask.x = x;
            mask.y = y;

            childUids.forEach((childUid) => {
                if (shapes[childUid]) {
                    shapes[childUid].mask = mask;
                }
            });
        }

        function refreshAllModalViewportMasks() {
            Object.keys(objects).forEach((uid) => {
                const obj = objects[uid];
                if (obj && obj.attributes && Array.isArray(obj.attributes.scroll_child_uids)) {
                    ensureModalViewportMask(uid);
                }
            });
        }
        window.refreshAllModalViewportMasks = refreshAllModalViewportMasks;

        function applyModalOpenState(modalUid) {
            const viewportUid = modalUid + '_content_viewport';
            const idsToAlwaysShow = [
                modalUid + '_body',
                modalUid + '_header',
                modalUid + '_title',
                modalUid + '_close_button',
                modalUid + '_close_text',
                viewportUid,
            ];

            idsToAlwaysShow.forEach((uid) => {
                if (shapes[uid]) shapes[uid].renderable = true;
                if (objects[uid] && objects[uid].attributes) {
                    objects[uid].attributes.renderable = true;
                }
            });

            const viewportObject = objects[viewportUid];
            if (viewportObject && viewportObject.attributes && Array.isArray(viewportObject.attributes.scroll_child_uids)) {
                const initialRenderables = (viewportObject.attributes.scroll_initial_renderables && typeof viewportObject.attributes.scroll_initial_renderables === 'object')
                    ? viewportObject.attributes.scroll_initial_renderables
                    : {};
                const childUids = viewportObject.attributes.scroll_child_uids;
                const isPanelUid = (uid) => typeof uid === 'string' && uid.indexOf('_container_panel') !== -1;
                const hasVisibleBaseContent = childUids.some((uid) => {
                    if (isPanelUid(uid)) return false;
                    return initialRenderables[uid] === undefined ? true : !!initialRenderables[uid];
                });

                childUids.forEach((uid) => {
                    let shouldShow = initialRenderables[uid] === undefined ? true : !!initialRenderables[uid];
                    if (!hasVisibleBaseContent) {
                        shouldShow = !isPanelUid(uid);
                    }
                    if (isPanelUid(uid)) {
                        shouldShow = !!(objects[uid] && objects[uid].attributes && objects[uid].attributes.renderable);
                    }
                    if (shapes[uid]) shapes[uid].renderable = shouldShow;
                    if (objects[uid] && objects[uid].attributes) {
                        objects[uid].attributes.renderable = shouldShow;
                    }
                });
            }
        }

        function applyModalClosedState(modalUid) {
            const viewportUid = modalUid + '_content_viewport';
            const idsToHide = [
                modalUid + '_body',
                modalUid + '_header',
                modalUid + '_title',
                modalUid + '_close_button',
                modalUid + '_close_text',
                viewportUid,
            ];

            const viewportObject = objects[viewportUid];
            if (viewportObject && viewportObject.attributes && Array.isArray(viewportObject.attributes.scroll_child_uids)) {
                viewportObject.attributes.scroll_child_uids.forEach((uid) => {
                    idsToHide.push(uid);
                });
            }

            idsToHide.forEach((uid) => {
                if (shapes[uid]) shapes[uid].renderable = false;
                if (objects[uid] && objects[uid].attributes) {
                    objects[uid].attributes.renderable = false;
                }
            });
        }

        function reapplyOpenModalsState() {
            const openModals = (window.AppData && window.AppData.open_modals) ? window.AppData.open_modals : {};
            Object.keys(openModals).forEach((modalUid) => {
                if (openModals[modalUid]) {
                    applyModalOpenState(modalUid);
                } else {
                    applyModalClosedState(modalUid);
                }
            });
            refreshAllModalViewportMasks();
        }
        window.reapplyOpenModalsState = reapplyOpenModalsState;

        function getFormData(fields) {
            let datas = {};
            for (let key in fields) {
                if (key.startsWith('field_')) {
                    let fieldName = key.substring(6);
                    let fieldUid = fields[key];

                    let fieldShapes = shapes[fieldUid];
                    let fieldValue = fieldShapes ? fieldShapes.text : '';
                    datas[fieldName] = fieldValue;
                } else if (key.startsWith('static_')) {
                    let fieldName = key.substring(7);
                    datas[fieldName] = fields[key];
                }
            }
            return datas;
        }

        let app = null;
        let shapes = {};
        let objects = {};

        function runBackendCode(code) {
            if (typeof code !== 'string' || code.trim() === '') return;
            try {
                eval(code);
            } catch (error) {
                console.error('Error executing backend code item:', error);
            }
        }

        window.pusher = null;
        window.currentChannel = null;
        let drawEventQueue = Promise.resolve();
        let drawWs = null;
        let drawWsReady = false;
        let drawWsReconnectTimer = null;
        const drawWsPending = new Map();
        const drawWsQueue = [];

        function initDrawItemsSocket() {
            if (!config.DRAW_WS_URL) return;
            if (drawWs && (drawWs.readyState === WebSocket.OPEN || drawWs.readyState === WebSocket.CONNECTING)) {
                return;
            }
            drawWs = new WebSocket(config.DRAW_WS_URL);

            drawWs.onopen = function () {
                drawWsReady = true;
                while (drawWsQueue.length > 0) {
                    const payload = drawWsQueue.shift();
                    drawWs.send(JSON.stringify(payload));
                }
            };

            drawWs.onmessage = function (event) {
                let response = null;
                try {
                    response = JSON.parse(event.data);
                } catch (error) {
                    console.error('Invalid draw WS response:', error);
                    return;
                }

                const requestId = response.request_id;
                if (!requestId || !drawWsPending.has(requestId)) {
                    return;
                }

                const pending = drawWsPending.get(requestId);
                drawWsPending.delete(requestId);
                pending.resolve(response);
            };

            drawWs.onclose = function () {
                drawWsReady = false;
                if (drawWsReconnectTimer) {
                    clearTimeout(drawWsReconnectTimer);
                }
                drawWsReconnectTimer = setTimeout(initDrawItemsSocket, 1000);
            };

            drawWs.onerror = function (error) {
                console.error('Draw WS error:', error);
            };
        }

        function fetchDrawItemsWs(requestId, playerIdFromEvent) {
            return new Promise((resolve, reject) => {
                const payload = {
                    action: 'get_draw_item',
                    request_id: requestId,
                    player_id: playerIdFromEvent,
                    session_id: sessionId
                };

                drawWsPending.set(requestId, { resolve, reject });

                if (drawWsReady && drawWs) {
                    drawWs.send(JSON.stringify(payload));
                } else {
                    drawWsQueue.push(payload);
                    initDrawItemsSocket();
                }

                setTimeout(() => {
                    if (drawWsPending.has(requestId)) {
                        drawWsPending.delete(requestId);
                        reject(new Error('draw_ws_timeout'));
                    }
                }, 10000);
            });
        }

        async function processDrawInterfaceEvent(data) {
            const requestId = data && data.request_id ? data.request_id : null;
            const playerIdFromEvent = data && data.player_id ? data.player_id : null;
            if (!requestId || !playerIdFromEvent) {
                console.warn('draw_interface missing request_id/player_id');
                return;
            }

            let items = null;
            try {
                const result = await fetchDrawItemsWs(requestId, playerIdFromEvent);
                if (result && result.success && result.items !== undefined) {
                    items = result.items;
                }
            } catch (error) {
                console.error('draw items ws error:', error);
                return;
            }

            if (!items) {
                console.warn('draw_interface missing items payload');
                return;
            }
            if (typeof items === 'string' || items instanceof String) {
                try {
                    items = JSON.parse(items);
                } catch (error) {
                    console.error('Error parsing draw items JSON:', error);
                    items = [];
                }
            }
            if (!Array.isArray(items)) {
                const maybeJson = (items !== null && items !== undefined) ? String(items).trim() : '';
                if (maybeJson.startsWith('[') || maybeJson.startsWith('{')) {
                    try {
                        items = JSON.parse(maybeJson);
                    } catch (error) {
                        console.error('Error parsing draw items JSON:', error);
                        items = [];
                    }
                }
            }
            if (!Array.isArray(items)) {
                console.warn('Draw items is not an array:', items);
                items = [];
            }
            await processDrawItems(items);
            refreshAllModalViewportMasks();
            runScrollClipping();
            reapplyOpenModalsState();
            ensureMapNavButtonsPositionAndZIndex();
            app.stage.sortChildren();
            await new Promise((resolve) => requestAnimationFrame(resolve));
        }

        async function processDrawItems(items) {
            for (const item of items) {
                if (!item || typeof item !== 'object') {
                    console.warn('Skipping invalid draw item:', item);
                    continue;
                }
                if (item['type'] === undefined || item['type'] === null) {
                    console.warn('Skipping draw item without type:', item);
                    continue;
                }
                let itemType = item['type'].toString();
                if (itemType === 'draw') {
                    let obj = item['object'];
                    if (obj.id === undefined) obj.id = obj.uid;
                    const objectGroup = typeof window.getObjectScrollGroup === 'function'
                        ? window.getObjectScrollGroup(obj)
                        : null;
                    if (objectGroup && typeof window.applyScrollGroupOffsetToObject === 'function') {
                        obj = window.applyScrollGroupOffsetToObject(obj, AppData, objectGroup);
                    }
                    if (obj.type === 'square') drawSquare(obj);
                    else if (obj.type === 'rectangle') drawRectangle(obj);
                    else if (obj.type === 'multi_line') drawMultiLine(obj);
                    else if (obj.type === 'circle') drawCircle(obj);
                    else if (obj.type === 'text') drawText(obj);
                    else if (obj.type === 'image') await drawImage(obj);
                } else if (itemType === 'update') {
                    if (item.sleep) await sleep(item.sleep);
                    let shape = shapes[item.uid];
                    let object = objects[item.uid];
                    if (shape) {
                        const objectGroup = (typeof window.getObjectScrollGroup === 'function' && object)
                            ? window.getObjectScrollGroup(object)
                            : null;
                        const excludedUids = typeof window.getScrollExcludedUids === 'function'
                            ? window.getScrollExcludedUids(AppData)
                            : [];
                        const isMapObject = typeof window.isInScrollGroup === 'function'
                            ? window.isInScrollGroup(item.uid, object, objectGroup, excludedUids)
                            : false;
                        Object.keys(item.attributes).forEach(key => {
                            if (key === 'color') {
                                shape.tint = item.attributes[key];
                                if (object) object.color = item.attributes[key];
                            } else if (key === 'renderable') {
                                shape.renderable = !!item.attributes[key];
                                if (object) {
                                    object.attributes = object.attributes || {};
                                    object.attributes.renderable = !!item.attributes[key];
                                }
                            } else {
                                let value = item.attributes[key];
                                if (isMapObject && key === 'x') {
                                    const offset = (typeof window.getScrollGroupOffset === 'function')
                                        ? window.getScrollGroupOffset(AppData, objectGroup)
                                        : { x: 0, y: 0 };
                                    value = value + offset.x;
                                } else if (isMapObject && key === 'y') {
                                    const offset = (typeof window.getScrollGroupOffset === 'function')
                                        ? window.getScrollGroupOffset(AppData, objectGroup)
                                        : { x: 0, y: 0 };
                                    value = value + offset.y;
                                } else if (isMapObject && key === 'points' && Array.isArray(value) && typeof shape.clear === 'function') {
                                    const offset = (typeof window.getScrollGroupOffset === 'function')
                                        ? window.getScrollGroupOffset(AppData, objectGroup)
                                        : { x: 0, y: 0 };
                                    const offsetX = offset.x;
                                    const offsetY = offset.y;
                                    value = value.map((point) => ({ x: point.x + offsetX, y: point.y + offsetY }));
                                    shape.clear();
                                    shape.lineStyle(object?.thickness || 1, 0xFFFFFF);
                                    shape.tint = object?.color;
                                    if (value.length > 0) {
                                        shape.moveTo(value[0].x, value[0].y);
                                        for (let i = 1; i < value.length; i++) {
                                            shape.lineTo(value[i].x, value[i].y);
                                        }
                                    }
                                }

                                shape[key] = value;
                                if (object) object[key] = value;
                            }
                        });
                    }
                } else if (itemType === 'clear') {
                    if (modalViewportMasks[item.uid]) {
                        const mask = modalViewportMasks[item.uid];
                        if (mask.parent) {
                            mask.parent.removeChild(mask);
                        }
                        if (typeof mask.destroy === 'function') {
                            mask.destroy();
                        }
                        delete modalViewportMasks[item.uid];
                    }
                    let shape = shapes[item.uid];
                    if (shape) {
                        if (typeof shape.clear === 'function') shape.clear();
                        app.stage.removeChild(shape);
                        delete shapes[item.uid];
                    }
                    delete objects[item.uid];
                } else if (itemType === 'code') {
                    if (item.sleep) await sleep(item.sleep);
                    runBackendCode(item.code);
                }

            }
        }

        function bindChannelEvents(channel) {
            if (!channel) return;
            // Avoid duplicated listeners on reconnect: duplicates can break action ordering.
            channel.unbind('draw_interface');

            channel.bind('draw_interface', function (data) {
                drawEventQueue = drawEventQueue
                    .then(() => processDrawInterfaceEvent(data))
                    .catch((err) => {
                        status('Errore dati mappa');
                        console.error(err);
                    });
            });
        }

        async function fetchAndConnectRemoteSockets(playerId) {
            try {
                const response = await $.ajax({
                    url: `${BACK_URL}/api/game/websocket_info`,
                    type: 'POST',
                    data: { player_id: playerId }
                });

                if (response.success && response.containers) {
                    status('Trovati ' + response.containers.length + ' container remoti');
                    
                    // Chiude instanze precedenti
                    for (const key in window.gameWebSockets) {
                        try { window.gameWebSockets[key].close(); } catch(e) {}
                    }
                    window.gameWebSockets = {};

                    response.containers.forEach(container => {
                        if (container.ws_port) {
                            const wsUrl = container.ws_gateway_url || container.ws_url;
                            console.log(`[Remote WS] Connessione a ${container.type} (${container.name}) su ${wsUrl}`);
                            const ws = new WebSocket(wsUrl);
                            
                            ws.onopen = function () {
                                console.log(`[Remote WS] Aperta connessione a ${container.type}`);
                            };
                            
                            ws.onmessage = function (event) {
                                console.log(`[Remote WS] Dati da ${container.type}:`, event.data);
                            };
                            
                            ws.onerror = function (error) {
                                console.error(`[Remote WS] Errore su ${container.type}:`, error);
                            };
                            
                            window.gameWebSockets[container.name] = ws;
                        }
                    });
                }
            } catch (err) {
                console.error("[Remote WS] Errore nel recupero info websocket:", err);
            }
        }
        window.switchPlayerChannel = function (newPlayerId) {
            if (window.currentChannel && window.pusher) {
                window.currentChannel.unbind_all();
                window.pusher.unsubscribe(window.currentChannel.name);
            }
            const channelName = 'player_' + newPlayerId + '_channel';
            if (!window.pusher) return;
            window.currentChannel = window.pusher.subscribe(channelName);
            window.currentChannel.bind('pusher:subscription_succeeded', function () {
                status('Sottoscritto al canale: ' + channelName);
                console.log('Subscribed to channel:', channelName);
            });
            window.currentChannel.bind('pusher:subscription_error', function (data) {
                status('Errore sottoscrizione: ' + (data?.error || 'unknown'));
                console.error('Subscription error:', data);
            });
            bindChannelEvents(window.currentChannel);
            
            // Connessione ai websocket dinamici remoti
            fetchAndConnectRemoteSockets(newPlayerId);
        };

        const triggerInitialMap = () => {
            status('Generazione login...');
            $.ajax({
                url: `${BACK_URL}/api/game/login`,
                type: 'POST',
                data: { player_id: playerId },
                success: function () { status('Richiesta login inviata!'); },
                error: function (err) { status('Errore login'); console.error(err); }
            });
        };

        class BasicDraw {
            constructor(object) {
                this.object = object;
                this.shapeType = object['type'];
                this.shape = null;
            }
            render(pixiApp) {
                if (!this.shape) return;
                const object = this.object;
                const uid = object['uid'];

                // Rimuovi eventuale oggetto duplicato con lo stesso UID per evitare "ghosting"
                if (shapes[uid]) {
                    pixiApp.stage.removeChild(shapes[uid]);
                    if (typeof shapes[uid].destroy === 'function') shapes[uid].destroy();
                    delete shapes[uid];
                }

                this.shape.renderable = object['attributes'] && object['attributes']['renderable'] !== undefined
                    ? !!object['attributes']['renderable']
                    : true;

                if (object['attributes'] && object['attributes']['z_index'] !== undefined) {
                    this.shape.zIndex = object['attributes']['z_index'];
                }
                if (object['attributes'] && object['attributes']['alpha'] !== undefined) {
                    this.shape.alpha = object['attributes']['alpha'];
                }

                pixiApp.stage.addChild(this.shape);
                shapes[uid] = this.shape;
                objects[uid] = this.object;
                this.addInteractive();
            }
            addInteractive() {
                const object = objects[this.object['uid']];
                if (!object['attributes'] || !object['attributes']['interactives'] || object['attributes']['interactives']['count'] === 0) return;

                this.shape.interactive = true;
                this.shape.cursor = 'pointer';
                const items = object['attributes']['interactives']['items'];

                const targetShape = this.shape;
                Object.entries(items).forEach(([event, strFunction]) => {
                    const processedScript = strFunction
                        .replace(/<script>/g, '')
                        .replace(/<\/script>/g, '')
                        .replace(/window\.location\.hostname/g, `'${hostname}'`);

                    targetShape.on(event, (evt) => {
                        try {
                            (function (object, shape, shapes, objects, AppData, event) {
                                eval(processedScript);
                            })(object, targetShape, shapes, objects, AppData, evt);
                        } catch (e) { console.error('Error executing interaction script:', e); }
                    });
                });
            }
        }

        class Square extends BasicDraw {
            constructor(object) { super(object); this.shape = new PIXI.Sprite(PIXI.Texture.WHITE); }
            build() {
                const object = this.object;
                this.shape.width = object['size'];
                this.shape.height = object['size'];
                this.shape.x = object['x'];
                this.shape.y = object['y'];
                this.shape.tint = object['color'];
            }
        }

        class Rectangle extends BasicDraw {
            constructor(object) { super(object); this.shape = new PIXI.Graphics(); }
            build() {
                const object = this.object;
                let color = object['color'] || 0xFFFFFF;
                let borderColor = object['borderColor'];
                let thickness = object['thickness'] || 0;
                // Convert color number to hex if needed
                if (typeof color === 'string' && color.startsWith('#')) {
                    color = parseInt(color.slice(1), 16);
                }
                if (typeof borderColor === 'string' && borderColor.startsWith('#')) {
                    borderColor = parseInt(borderColor.slice(1), 16);
                }
                const uid = (object['uid'] || '').toString();
                const isProgressBar = uid.includes('_progress_bar_') || uid.includes('gene_progress_');
                const radius = isProgressBar
                    ? 0
                    : (object['borderRadius'] !== undefined
                        ? object['borderRadius']
                        : (object['radius'] !== undefined ? object['radius'] : 8));
                if (borderColor !== undefined && borderColor !== null && thickness > 0) {
                    this.shape.lineStyle(thickness, borderColor);
                }
                this.shape.beginFill(color);
                this.shape.drawRoundedRect(0, 0, object['width'], object['height'], radius);
                this.shape.endFill();
                this.shape.x = object['x'];
                this.shape.y = object['y'];
            }
        }

        class MultiLine extends BasicDraw {
            constructor(object) { super(object); this.shape = new PIXI.Graphics(); }
            build() {
                const object = this.object;
                let lineColor = object['color'];
                const lineThickness = object['thickness'] || 1;
                const points = object['points'];
                if (typeof lineColor === 'string' && lineColor.startsWith('#')) {
                    lineColor = parseInt(lineColor.slice(1), 16);
                }
                this.shape.lineStyle(lineThickness, lineColor || 0xFFFFFF);
                if (points && points.length > 0) {
                    this.shape.moveTo(points[0].x, points[0].y);
                    for (let i = 1; i < points.length; i++) {
                        this.shape.lineTo(points[i].x, points[i].y);
                    }
                }
            }
        }

        class Circle extends BasicDraw {
            constructor(object) { super(object); this.shape = new PIXI.Graphics(); }
            build() {
                const object = this.object;
                this.shape.beginFill(0xFFFFFF);
                this.shape.drawCircle(0, 0, object['radius']);
                this.shape.endFill();
                this.shape.tint = object['color'];
                this.shape.x = object['x'];
                this.shape.y = object['y'];
            }
        }

        class Text extends BasicDraw {
            constructor(object) { super(object); this.shape = new PIXI.Text('', {}); }
            build() {
                const object = this.object;
                this.shape.x = object['x'];
                this.shape.y = object['y'];
                if (object['color'] !== null && object['color'] !== undefined) {
                    let colorValue = object['color'];
                    // Handle different color formats
                    if (typeof colorValue === 'string') {
                        // Already a string, use as-is or add # if missing
                        this.shape.style.fill = colorValue.startsWith('#') ? colorValue : '#' + colorValue;
                    } else {
                        // It's a number, convert to hex
                        const hexValue = colorValue.toString(16).padStart(6, '0');
                        this.shape.style.fill = '#' + hexValue;
                    }
                }
                this.shape.style.fontFamily = object['fontFamily'];
                this.shape.style.fontSize = object['fontSize'];
                this.shape.text = object['text'];
                if (object['centerAnchor']) {
                    this.shape.pivot.set(this.shape.width / 2, this.shape.height / 2);
                }
            }
        }

        class ImageSprite extends BasicDraw {
            constructor(object) {
                super(object);
                this.shape = null;
                this.loaded = false;
            }
            build() {
                return new Promise((resolve, reject) => {
                    const object = this.object;
                    // Build full URL from relative path
                    let src = object['src'];
                    if (src && !src.startsWith('http')) {
                        src = BACK_URL + src;
                    }
                    console.log('Loading image from:', src);

                    const texture = PIXI.Texture.from(src);
                    this.shape = new PIXI.Sprite(texture);

                    if (texture.baseTexture.valid) {
                        this.applyProperties();
                        this.loaded = true;
                        resolve();
                    } else {
                        texture.baseTexture.on('loaded', () => {
                            this.applyProperties();
                            this.loaded = true;
                            resolve();
                        });
                        texture.baseTexture.on('error', (err) => {
                            console.error('Error loading image:', src, err);
                            reject(err);
                        });
                    }
                });
            }
            applyProperties() {
                const object = this.object;
                this.shape.x = object['x'];
                this.shape.y = object['y'];
                if (object['width'] !== undefined && object['width'] !== null) {
                    this.shape.width = object['width'];
                }
                if (object['height'] !== undefined && object['height'] !== null) {
                    this.shape.height = object['height'];
                }
                if (object['color'] !== undefined && object['color'] !== null) {
                    this.shape.tint = object['color'];
                }
            }
        }

        function initPixi() {
            app = new PIXI.Application({
                width: window.innerWidth,
                height: window.innerHeight,
                backgroundColor: 0xFFFFFF,
                antialias: true,
                resolution: window.devicePixelRatio || 1,
                autoDensity: true
            });
            document.getElementById('display_container').appendChild(app.view);
            app.stage.sortableChildren = true;
            window.addEventListener('resize', () => {
                app.renderer.resize(window.innerWidth, window.innerHeight);
                runScrollClipping();
                ensureMapNavButtonsPositionAndZIndex();
            });
        }

        function drawSquare(object) { let d = new Square(object); d.build(); d.render(app); }
        function drawRectangle(object) { let d = new Rectangle(object); d.build(); d.render(app); }
        function drawMultiLine(object) { let d = new MultiLine(object); d.build(); d.render(app); }
        function drawCircle(object) { let d = new Circle(object); d.build(); d.render(app); }
        function drawText(object) { let d = new Text(object); d.build(); d.render(app); }
        async function drawImage(object) { let d = new ImageSprite(object); await d.build(); d.render(app); }

        $(document).ready(function () {
            initPixi();
            status('PixiJS Avviato - Connessione a Reverb...');

            if (config.DEBUG_MODE) {
                Pusher.logToConsole = true;
            }

            initDrawItemsSocket();

            window.pusher = new Pusher(config.REVERB_APP_KEY, {
                cluster: config.REVERB_CLUSTER,
                wsHost: config.REVERB_HOST,
                wsPort: config.REVERB_PORT,
                wssPort: config.REVERB_PORT,
                forceTLS: config.REVERB_SCHEME === 'https',
                enabledTransports: ['ws', 'wss'],
                disableStats: true
            });

            window.pusher.connection.bind('connected', function () {
                status('Connesso a Reverb');
                console.log('Reverb connected');

                // Trigger initial map if no shapes
                if (Object.keys(shapes).length === 0) {
                    triggerInitialMap();
                }
            });

            window.pusher.connection.bind('disconnected', function () {
                status('Disconnesso da Reverb');
                console.log('Reverb disconnected');
            });

            window.pusher.connection.bind('error', function (error) {
                status('Errore connessione Reverb');
                console.error('Reverb connection error:', error);
            });

            // Inizializza il canale per il playerId corrente
            window.switchPlayerChannel(playerId);
        });
    </script>
</body>
